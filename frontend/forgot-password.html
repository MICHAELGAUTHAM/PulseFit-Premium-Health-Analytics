<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | PulseFit Recovery</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style Sheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
    <div class="aurora-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div id="mouse-glow" class="mouse-glow"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon-wrap">
                        <i data-lucide="activity"></i>
                    </div>
                    <span>Pulse<span>Fit</span></span>
                </a>
                <h2 class="auth-title" id="recovery-title">Reset Password</h2>
                <p class="auth-subtitle" id="recovery-subtitle">Enter your registered email to request a reset security code.</p>
            </div>

            <!-- STEP 1: Enter Email -->
            <form id="step1-form">
                <div class="form-group">
                    <label for="reset-email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="reset-email" class="form-input" placeholder="name@domain.com" required>
                    </div>
                </div>
                <button type="submit" class="btn-auth btn-ripple" id="step1-btn">
                    <span>Send Reset Code</span>
                    <i data-lucide="mail-check"></i>
                </button>
            </form>

            <!-- STEP 2: Enter OTP Code (Hidden by default) -->
            <form id="step2-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label" style="text-align: center;">Enter 6-Digit OTP Code</label>
                    <div class="otp-container">
                        <input type="text" maxlength="1" class="otp-input" id="otp-1" required>
                        <input type="text" maxlength="1" class="otp-input" id="otp-2" required>
                        <input type="text" maxlength="1" class="otp-input" id="otp-3" required>
                        <input type="text" maxlength="1" class="otp-input" id="otp-4" required>
                        <input type="text" maxlength="1" class="otp-input" id="otp-5" required>
                        <input type="text" maxlength="1" class="otp-input" id="otp-6" required>
                    </div>
                    <div style="font-size: 13px; text-align: center; margin-top: 10px;">
                        <span class="text-secondary">Didn't receive the code?</span>
                        <a href="#" class="auth-link" id="resend-otp-btn">Resend</a>
                    </div>
                </div>
                <button type="submit" class="btn-auth btn-ripple" id="step2-btn">
                    <span>Verify Code</span>
                    <i data-lucide="shield-check"></i>
                </button>
            </form>

            <!-- STEP 3: Setup New Password (Hidden by default) -->
            <form id="step3-form" style="display: none;">
                <div class="form-group">
                    <label for="new-pwd" class="form-label">New Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="new-pwd" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-new-pwd" class="form-label">Confirm New Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="confirm-new-pwd" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-auth btn-ripple" id="step3-btn">
                    <span>Reset Password</span>
                    <i data-lucide="check-circle-2"></i>
                </button>
            </form>

            <div class="auth-footer-text" style="margin-top: 25px;">
                Remember your password? <a href="login.html" class="auth-link">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();

            let userEmail = "";
            let verifiedOTP = "";

            const title = document.getElementById('recovery-title');
            const subtitle = document.getElementById('recovery-subtitle');

            const f1 = document.getElementById('step1-form');
            const f2 = document.getElementById('step2-form');
            const f3 = document.getElementById('step3-form');

            const btn1 = document.getElementById('step1-btn');
            const btn2 = document.getElementById('step2-btn');
            const btn3 = document.getElementById('step3-btn');

            // Manage OTP Input Focus Shifts
            const otpInputs = document.querySelectorAll('.otp-input');
            otpInputs.forEach((inp, idx) => {
                inp.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && idx < otpInputs.length - 1) {
                        otpInputs[idx + 1].focus();
                    }
                });
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                        otpInputs[idx - 1].focus();
                    }
                });
            });

            // STEP 1: Post email for OTP
            f1.addEventListener('submit', async (e) => {
                e.preventDefault();
                userEmail = document.getElementById('reset-email').value.trim();

                if (!userEmail) return;

                btn1.disabled = true;
                btn1.innerHTML = `<span class="spinner"></span> <span>Sending Code...</span>`;

                try {
                    const res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: userEmail })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok) {
                        showToast(`Reset code generated: ${data.otp_code}. (Dev note: entered in console/response)`, 'warning');
                        
                        // Switch Forms
                        f1.style.display = 'none';
                        f2.style.display = 'block';
                        title.textContent = "Verify Security Code";
                        subtitle.textContent = `A verification code was dispatched to ${userEmail}.`;
                        otpInputs[0].focus();
                    } else {
                        showToast(data.detail || 'Email address not found.', 'error');
                        btn1.disabled = false;
                        btn1.innerHTML = `<span>Send Reset Code</span> <i data-lucide="mail-check"></i>`;
                        if (window.lucide) window.lucide.createIcons();
                    }
                } catch (err) {
                    showToast('Connection refused. Check API server.', 'error');
                    btn1.disabled = false;
                    btn1.innerHTML = `<span>Send Reset Code</span> <i data-lucide="mail-check"></i>`;
                    if (window.lucide) window.lucide.createIcons();
                }
            });

            // STEP 2: Verify OTP
            f2.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                let code = "";
                otpInputs.forEach(i => code += i.value);

                if (code.length < 6) {
                    showToast('Please enter the complete 6-digit code.', 'error');
                    return;
                }

                btn2.disabled = true;
                btn2.innerHTML = `<span class="spinner"></span> <span>Verifying...</span>`;

                try {
                    const res = await fetch('/api/auth/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: userEmail, otp_code: code })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        verifiedOTP = code;
                        showToast('Verification completed. Setup your new credentials.', 'success');
                        
                        f2.style.display = 'none';
                        f3.style.display = 'block';
                        title.textContent = "New Password";
                        subtitle.textContent = "Enter and confirm your updated secure password.";
                    } else {
                        showToast(data.detail || 'Invalid verification code.', 'error');
                        btn2.disabled = false;
                        btn2.innerHTML = `<span>Verify Code</span> <i data-lucide="shield-check"></i>`;
                        if (window.lucide) window.lucide.createIcons();
                    }
                } catch (e) {
                    showToast('Verification request failed.', 'error');
                    btn2.disabled = false;
                    btn2.innerHTML = `<span>Verify Code</span> <i data-lucide="shield-check"></i>`;
                    if (window.lucide) window.lucide.createIcons();
                }
            });

            // STEP 3: Reset Password
            f3.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const newPwd = document.getElementById('new-pwd').value;
                const confirmNewPwd = document.getElementById('confirm-new-pwd').value;

                if (!newPwd || !confirmNewPwd) return;

                if (newPwd !== confirmNewPwd) {
                    showToast('Passwords do not match.', 'error');
                    return;
                }

                if (newPwd.length < 6) {
                    showToast('Password must be at least 6 characters long.', 'error');
                    return;
                }

                btn3.disabled = true;
                btn3.innerHTML = `<span class="spinner"></span> <span>Saving...</span>`;

                try {
                    const res = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: userEmail,
                            otp_code: verifiedOTP,
                            new_password: newPwd,
                            confirm_password: confirmNewPwd
                        })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        showToast('Password updated successfully. Navigating to Login...', 'success');
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1800);
                    } else {
                        showToast(data.detail || 'Password reset request expired.', 'error');
                        btn3.disabled = false;
                        btn3.innerHTML = `<span>Reset Password</span> <i data-lucide="check-circle-2"></i>`;
                        if (window.lucide) window.lucide.createIcons();
                    }
                } catch (err) {
                    showToast('Password update communication failed.', 'error');
                    btn3.disabled = false;
                    btn3.innerHTML = `<span>Reset Password</span> <i data-lucide="check-circle-2"></i>`;
                    if (window.lucide) window.lucide.createIcons();
                }
            });

            // Resend link click
            document.getElementById('resend-otp-btn').addEventListener('click', (e) => {
                e.preventDefault();
                f2.style.display = 'none';
                f1.style.display = 'block';
                title.textContent = "Reset Password";
                subtitle.textContent = "Enter your registered email to request a reset security code.";
                btn1.disabled = false;
                btn1.innerHTML = `<span>Send Reset Code</span> <i data-lucide="mail-check"></i>`;
                if (window.lucide) window.lucide.createIcons();
            });
        });
    </script>
</body>
</html>
