<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PulseFit Health Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style Sheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="dark-theme">
    <!-- Aurora background blobs -->
    <div class="aurora-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div id="mouse-glow" class="mouse-glow"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <div class="logo-icon-wrap">
                        <i data-lucide="activity"></i>
                    </div>
                    <span>Pulse<span>Fit</span></span>
                </a>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Enter your credentials to sync your biometric logs.</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="login-email" class="form-input" placeholder="name@domain.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                        <button type="button" id="pwd-toggle-btn" class="password-toggle" aria-label="Toggle Password Visibility">
                            <i data-lucide="eye" id="eye-icon"></i>
                            <i data-lucide="eye-off" id="eye-off-icon" style="display: none;"></i>
                        </button>
                    </div>
                </div>

                <div class="form-actions-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        <span>Remember Me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-auth btn-ripple" id="login-submit-btn">
                    <span>Sign In</span>
                    <i data-lucide="log-in"></i>
                </button>
            </form>

            <!-- Social divider -->
            <div class="social-divider">Or continue with</div>

            <div class="social-grid">
                <button class="btn-social" type="button" onclick="mockSocialLogin('Google')">
                    <i data-lucide="chrome"></i>
                    <span>Google</span>
                </button>
                <button class="btn-social" type="button" onclick="mockSocialLogin('GitHub')">
                    <i data-lucide="github"></i>
                    <span>GitHub</span>
                </button>
            </div>

            <div class="auth-footer-text">
                Don't have an account? <a href="register.html" class="auth-link">Register Now</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();

            const form = document.getElementById('login-form');
            const submitBtn = document.getElementById('login-submit-btn');
            const pwdInput = document.getElementById('login-password');
            const pwdToggle = document.getElementById('pwd-toggle-btn');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');

            // Password Toggle
            pwdToggle.addEventListener('click', () => {
                const isPassword = pwdInput.type === 'password';
                pwdInput.type = isPassword ? 'text' : 'password';
                eyeIcon.style.display = isPassword ? 'none' : 'block';
                eyeOffIcon.style.display = isPassword ? 'block' : 'none';
            });

            // Form Submit
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('login-email').value.trim();
                const password = pwdInput.value;
                const rememberMe = document.getElementById('remember-me').checked;

                // Simple validation
                if (!email || !password) {
                    showToast('Please fill out all required fields.', 'error');
                    return;
                }

                // Show Loading Animation
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span class="spinner"></span> <span>Signing In...</span>`;

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, remember_me: rememberMe })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        saveToken(data.access_token, rememberMe);
                        showToast('Login successful! Connecting dashboard...', 'success');
                        
                        // Celebration Confetti
                        if (typeof confetti === 'function') {
                            confetti({
                                particleCount: 100,
                                spread: 70,
                                origin: { y: 0.6 }
                            });
                        }
                        
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        showToast(data.detail || 'Incorrect email or password.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = `<span>Sign In</span> <i data-lucide="log-in"></i>`;
                        if (window.lucide) window.lucide.createIcons();
                    }
                } catch (error) {
                    showToast('An error occurred. Check backend server connection.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Sign In</span> <i data-lucide="log-in"></i>`;
                    if (window.lucide) window.lucide.createIcons();
                }
            });
        });

        function mockSocialLogin(provider) {
            showToast(`${provider} login simulation started...`, 'info');
            setTimeout(() => {
                showToast(`Mock OAuth authentication completed via ${provider}.`, 'success');
            }, 1000);
        }
    </script>
</body>
</html>
