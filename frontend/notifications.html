<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notifications | PulseFit Alerts</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Style Sheets -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dark-theme">
    <!-- Aurora background blobs -->
    <div class="aurora-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div id="mouse-glow" class="mouse-glow"></div>

    <!-- Navigation Header -->
    <nav class="nav-glass">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon-wrap">
                    <i data-lucide="activity" class="logo-icon"></i>
                </div>
                <span>Pulse<span>Fit</span></span>
            </a>
            <div class="nav-menu">
                <a href="index.html#dashboard" class="nav-link">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="index.html#water-bmi" class="nav-link">
                    <i data-lucide="heart-pulse"></i>
                    <span>Trackers</span>
                </a>
                <a href="history.html" class="nav-link">
                    <i data-lucide="history"></i>
                    <span>History</span>
                </a>
                <a href="achievements.html" class="nav-link">
                    <i data-lucide="trophy"></i>
                    <span>Achievements</span>
                </a>
                <a href="notifications.html" class="nav-link active">
                    <i data-lucide="bell"></i>
                    <span>Alerts</span>
                </a>
                <a href="profile.html" class="nav-link">
                    <i data-lucide="user"></i>
                    <span>Profile</span>
                </a>
                <a href="users.html" class="nav-link">
                    <i data-lucide="users"></i>
                    <span>Users</span>
                </a>
                <a href="settings.html" class="nav-link">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </div>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="sun-icon"></i>
                    <i data-lucide="moon" class="moon-icon"></i>
                </button>
                <div id="nav-auth-btn-wrap"></div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="page-container" style="max-width: 800px;">
        <section class="page-title-section" style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px;">
            <div style="text-align: left; margin-bottom: 0;">
                <h1 class="page-title">Alerts & <span class="gradient-text">Notifications</span></h1>
                <p class="page-subtitle">Logs of your goal completion reports, unlocked achievements, and body vitals warnings.</p>
            </div>
            <button id="btn-read-all" class="btn btn-secondary btn-ripple" style="padding: 10px 18px; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                <i data-lucide="check-check" style="width: 16px; height: 16px;"></i> Mark All Read
            </button>
        </section>

        <!-- Notifications Container -->
        <div class="marketing-card" style="padding: 24px; min-height: 400px; margin-bottom: 60px;">
            <div class="notification-list" id="notifications-wrap">
                <!-- Loaded dynamically -->
                <p style="text-align: center; color: var(--text-secondary); margin-top: 50px;">Fetching notification logs...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-glass">
        <div class="footer-container">
            <div class="footer-brand">
                <i data-lucide="activity" class="text-primary"></i>
                <span class="font-heading">PulseFit</span>
            </div>
            <p class="footer-copy">© 2026 PulseFit Inc. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();

            const container = document.getElementById('notifications-wrap');
            const btnReadAll = document.getElementById('btn-read-all');

            // Load notifications
            async function loadNotifications() {
                try {
                    const res = await apiFetch('/notifications');
                    if (res.ok) {
                        const notes = await res.json();
                        if (notes.length === 0) {
                            container.innerHTML = `
                                <div style="text-align: center; color: var(--text-secondary); padding-top: 60px;">
                                    <i data-lucide="bell-off" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
                                    <p>Your notifications timeline is clean.</p>
                                </div>
                            `;
                            if (window.lucide) window.lucide.createIcons();
                            return;
                        }

                        container.innerHTML = '';
                        notes.forEach(n => {
                            const dateStr = new Date(n.created_at).toLocaleDateString('en-US', {
                                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                            });
                            
                            // Map notification types to colors and icons
                            let colorClass = "bg-primary-soft text-primary";
                            let icon = "bell";
                            
                            if (n.type === 'water_reminder') {
                                colorClass = "bg-primary-soft text-primary";
                                icon = "droplet";
                            } else if (n.type === 'goal_completed') {
                                colorClass = "bg-success-soft text-success";
                                icon = "target";
                            } else if (n.type === 'achievement_unlocked') {
                                colorClass = "bg-warning-soft text-warning";
                                icon = "trophy";
                            } else if (n.type === 'health_warning') {
                                colorClass = "bg-danger-soft text-danger";
                                icon = "alert-triangle";
                            }

                            const card = document.createElement('div');
                            card.className = `notification-card ${n.is_read ? '' : 'unread'}`;
                            card.innerHTML = `
                                <div class="notification-icon-wrap ${colorClass}">
                                    <i data-lucide="${icon}"></i>
                                </div>
                                <div class="notification-content">
                                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                        <h4 class="notification-title">${n.title}</h4>
                                        <span class="notification-time">${dateStr}</span>
                                    </div>
                                    <p class="notification-msg">${n.message}</p>
                                    ${n.is_read ? '' : `<button class="btn-read-mark" onclick="markRead(${n.id})">Mark as read</button>`}
                                </div>
                            `;
                            container.appendChild(card);
                        });

                        if (window.lucide) window.lucide.createIcons();
                    }
                } catch (e) {
                    container.innerHTML = `<p style="text-align: center; color: var(--danger-color); margin-top: 50px;">Failed to load notifications.</p>`;
                }
            }

            // Mark a single notification read
            window.markRead = async (id) => {
                try {
                    const res = await apiFetch(`/notifications/${id}/read`, {
                        method: 'PUT'
                    });
                    if (res.ok) {
                        loadNotifications();
                    }
                } catch (err) {
                    console.error('Failed to mark read', err);
                }
            };

            // Mark all read
            btnReadAll.addEventListener('click', async () => {
                try {
                    const res = await apiFetch('/notifications/read-all', {
                        method: 'PUT'
                    });
                    if (res.ok) {
                        showToast('All notifications marked as read.', 'success');
                        loadNotifications();
                    }
                } catch (err) {
                    showToast('Failed to update notifications.', 'error');
                }
            });

            // Initial load
            loadNotifications();
        });
    </script>
</body>
</html>
